services:
  rdp-web:
    build: .
    container_name: rdp-web
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    ports:
      - "${RDPWEB_BIND_IP:-127.0.0.1}:8080:8080"
    environment:
      RDPWEB_ADDR: ":8080"
      RDPWEB_DATA_DIR: "/data"
      RDPWEB_PUBLIC_URL: "${RDPWEB_PUBLIC_URL:-}"
      RDPWEB_SECURE_COOKIE: "${RDPWEB_SECURE_COOKIE:-auto}"
      RDPWEB_SETUP_TOKEN: "${RDPWEB_SETUP_TOKEN:-}"
      RDPWEB_SESSION_TTL: "${RDPWEB_SESSION_TTL:-720h}"
    volumes:
      - rdpweb-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  rdpweb-data:
    name: rdpweb-data
