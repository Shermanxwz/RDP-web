name: Branch fixup

on:
  push:
    branches: [feat/product-v1]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/product-v1
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Apply compatibility fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('internal/app/app.go')
          s = p.read_text()
          s = s.replace('ID string `json:"id"`; Name string `json:"name"`;', 'Name string `json:"name"`;')
          s = s.replace('if err := decodeJSONLimit(r, &raw, 2<<20); err != nil', 'if err := decodeJSONCompat(r, &raw, 2<<20); err != nil')
          s = s.replace('id := item.ID; if id == "" { id, _ = security.RandomToken(12) }', 'id, _ := security.RandomToken(12)')
          marker = 'func decodeJSONLimit(r *http.Request, dst any, limit int64) error {'
          compat = '''func decodeJSONCompat(r *http.Request, dst any, limit int64) error {
              defer r.Body.Close()
              dec := json.NewDecoder(io.LimitReader(r.Body, limit))
              if err := dec.Decode(dst); err != nil {
                  return fmt.Errorf("invalid JSON: %w", err)
              }
              if dec.Decode(&struct{}{}) != io.EOF {
                  return errors.New("invalid JSON: multiple values")
              }
              return nil
          }

          '''
          if 'func decodeJSONCompat' not in s:
              s = s.replace(marker, compat + marker)
          p.write_text(s)
      - name: Normalize Go module and source
        run: |
          go mod tidy
          gofmt -w $(find . -name '*.go')
          go test ./...
          go vet ./...
      - name: Commit normalized tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add go.mod go.sum '*.go' 'internal/**/*.go'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: normalize build and legacy import compatibility'
          git push origin HEAD:feat/product-v1
