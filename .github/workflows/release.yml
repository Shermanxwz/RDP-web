name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install E2E dependency lock
        run: npm ci
      - name: Audit E2E dependencies
        run: npm audit --audit-level=high

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Build and checksum
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          ext=""
          [ "$GOOS" = windows ] && ext=.exe
          name="rdpweb-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags="-s -w" -o "$name" ./cmd/rdpweb
          sha256sum "$name" > "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: rdpweb-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            rdpweb-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: rdpweb-*
          path: release
          merge-multiple: true
      - name: Verify checksums before publication
        working-directory: release
        run: |
          set -euo pipefail
          for sum in *.sha256; do sha256sum -c "$sum"; done
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
