name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Format
        run: test -z "$(gofmt -l $(find . -name '*.go'))"
      - name: Race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Production build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/rdpweb

  native:
    name: native-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Native tests
        run: go test ./...
      - name: Native vet
        run: go vet ./...
      - name: Native build
        run: go build -trimpath ./cmd/rdpweb

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rdp-web:ci
      - name: Real container lifecycle and persistence
        env:
          RDPWEB_IMAGE: rdp-web:ci
        run: bash scripts/container-smoke.sh

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install E2E dependencies
        run: npm ci
      - name: Audit E2E dependencies
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start application
        env:
          RDPWEB_ADDR: ':18081'
          RDPWEB_DATA_DIR: ${{ runner.temp }}/browser-data
          RDPWEB_SETUP_TOKEN: browser-setup-token
        run: |
          go run ./cmd/rdpweb >"${{ runner.temp }}/rdpweb-browser.log" 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:18081/healthz >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18081/healthz >/dev/null
      - name: Browser product E2E
        run: npx playwright test tests/browser.spec.js --project=chromium
