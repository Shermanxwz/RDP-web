name: Seal bootstrap

on:
  push:
    branches: [hardening/seal-v1]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hardening/seal-v1
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Apply hardening and integration tests
        shell: python
        run: |
          from pathlib import Path

          store = Path('internal/store/store.go')
          s = store.read_text()
          s = s.replace('type Store struct{ db *sql.DB }', 'type Store struct{ db *sql.DB }')
          marker = 'func (s *Store) UserCount(ctx context.Context) (int, error) {'
          insert = r'''func (s *Store) Ping(ctx context.Context) error {
	return s.db.PingContext(ctx)
}

func (s *Store) CreateInitialOwner(ctx context.Context, username, passwordHash string) (User, error) {
	username = strings.TrimSpace(username)
	if len(username) < 3 || len(username) > 64 || strings.ContainsAny(username, "\r\n\t") {
		return User{}, errors.New("username must be 3-64 characters")
	}
	tx, err := s.db.BeginTx(ctx, nil)
	if err != nil {
		return User{}, err
	}
	defer tx.Rollback()
	var count int
	if err := tx.QueryRowContext(ctx, `SELECT COUNT(*) FROM users`).Scan(&count); err != nil {
		return User{}, err
	}
	if count != 0 {
		return User{}, errors.New("setup is already complete")
	}
	now := time.Now().UTC().Format(time.RFC3339Nano)
	result, err := tx.ExecContext(ctx, `INSERT INTO users(username,password_hash,created_at) VALUES(?,?,?)`, username, passwordHash, now)
	if err != nil {
		return User{}, err
	}
	id, err := result.LastInsertId()
	if err != nil {
		return User{}, err
	}
	if err := tx.Commit(); err != nil {
		return User{}, err
	}
	return User{ID: id, Username: username, PasswordHash: passwordHash}, nil
}

'''
          if 'CreateInitialOwner' not in s:
              s = s.replace(marker, insert + marker)

          marker2 = 'func (s *Store) DeleteSession(ctx context.Context, tokenHash string) error {'
          rate = r'''func (s *Store) LoginFailureCount(ctx context.Context, key string, since time.Time) (int, error) {
	var count int
	err := s.db.QueryRowContext(ctx, `SELECT COUNT(*) FROM login_failures WHERE failure_key=? AND created_at>=?`, key, since.UTC().Format(time.RFC3339Nano)).Scan(&count)
	return count, err
}

func (s *Store) RecordLoginFailure(ctx context.Context, key string, now time.Time) error {
	cutoff := now.Add(-24 * time.Hour).UTC().Format(time.RFC3339Nano)
	_, _ = s.db.ExecContext(ctx, `DELETE FROM login_failures WHERE created_at < ?`, cutoff)
	_, err := s.db.ExecContext(ctx, `INSERT INTO login_failures(failure_key,created_at) VALUES(?,?)`, key, now.UTC().Format(time.RFC3339Nano))
	return err
}

func (s *Store) ClearLoginFailures(ctx context.Context, key string) error {
	_, err := s.db.ExecContext(ctx, `DELETE FROM login_failures WHERE failure_key=?`, key)
	return err
}

'''
          if 'LoginFailureCount' not in s:
              s = s.replace(marker2, rate + marker2)
          s = s.replace('CREATE INDEX IF NOT EXISTS idx_sessions_expiry ON sessions(expires_at);', 'CREATE INDEX IF NOT EXISTS idx_sessions_expiry ON sessions(expires_at);\nCREATE TABLE IF NOT EXISTS login_failures (\n  id INTEGER PRIMARY KEY AUTOINCREMENT,\n  failure_key TEXT NOT NULL,\n  created_at TEXT NOT NULL\n);\nCREATE INDEX IF NOT EXISTS idx_login_failures_key_time ON login_failures(failure_key,created_at);')

          tail = r'''

type RestorePayload struct {
	Groups  []Group
	Devices []Device
}

func (s *Store) RestoreReplace(ctx context.Context, userID int64, payload RestorePayload) error {
	tx, err := s.db.BeginTx(ctx, nil)
	if err != nil {
		return err
	}
	defer tx.Rollback()
	for _, g := range payload.Groups {
		if err := ValidateGroup(g); err != nil {
			return err
		}
	}
	groupIDs := map[string]struct{}{}
	for _, g := range payload.Groups {
		groupIDs[g.ID] = struct{}{}
	}
	for _, d := range payload.Devices {
		if err := ValidateDevice(d); err != nil {
			return err
		}
		if d.GroupID != "" {
			if _, ok := groupIDs[d.GroupID]; !ok {
				return errors.New("device references unknown group")
			}
		}
	}
	if _, err := tx.ExecContext(ctx, `DELETE FROM devices WHERE user_id=?`, userID); err != nil {
		return err
	}
	if _, err := tx.ExecContext(ctx, `DELETE FROM groups WHERE user_id=?`, userID); err != nil {
		return err
	}
	now := time.Now().UTC().Format(time.RFC3339Nano)
	for _, g := range payload.Groups {
		if _, err := tx.ExecContext(ctx, `INSERT INTO groups(id,user_id,name,sort_order,created_at,updated_at) VALUES(?,?,?,?,?,?)`, g.ID, userID, strings.TrimSpace(g.Name), g.SortOrder, now, now); err != nil {
			return err
		}
	}
	for _, d := range payload.Devices {
		var group any
		if d.GroupID != "" {
			group = d.GroupID
		}
		if _, err := tx.ExecContext(ctx, `INSERT INTO devices(id,user_id,group_id,name,host,port,username,domain,gateway,favorite,notes,use_multimon,redirect_clipboard,audio_mode,created_at,updated_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`, d.ID, userID, group, strings.TrimSpace(d.Name), strings.TrimSpace(d.Host), d.Port, strings.TrimSpace(d.Username), strings.TrimSpace(d.Domain), strings.TrimSpace(d.Gateway), d.Favorite, strings.TrimSpace(d.Notes), d.UseMultimon, d.RedirectClipboard, d.AudioMode, now, now); err != nil {
			return err
		}
	}
	return tx.Commit()
}
'''
          if 'RestoreReplace' not in s:
              s += tail
          store.write_text(s)

          app = Path('internal/app/app.go')
          a = app.read_text()
          a = a.replace('if r.URL.Path == "/healthz" {\n\t\twriteJSON(w, http.StatusOK, map[string]any{"ok": true})\n\t\treturn\n\t}', 'if r.URL.Path == "/healthz" {\n\t\tif err := a.store.Ping(r.Context()); err != nil {\n\t\t\twriteJSON(w, http.StatusServiceUnavailable, map[string]any{"ok": false})\n\t\t\treturn\n\t\t}\n\t\twriteJSON(w, http.StatusOK, map[string]any{"ok": true})\n\t\treturn\n\t}')
          old_setup = '''count, err := a.store.UserCount(r.Context())
	if err != nil {
		a.internal(w, err)
		return
	}
	if count != 0 {
		writeError(w, http.StatusConflict, "setup is already complete")
		return
	}
	var in struct{ Username, Password string }'''
          a = a.replace(old_setup, 'var in struct{ Username, Password string }')
          a = a.replace('user, err := a.store.CreateUser(r.Context(), in.Username, hash)', 'user, err := a.store.CreateInitialOwner(r.Context(), in.Username, hash)')
          a = a.replace('writeError(w, http.StatusBadRequest, "unable to create owner account")', 'if strings.Contains(strings.ToLower(err.Error()), "setup is already complete") {\n\t\t\twriteError(w, http.StatusConflict, "setup is already complete")\n\t\t} else {\n\t\t\twriteError(w, http.StatusBadRequest, "unable to create owner account")\n\t\t}')
          old_login = '''user, err := a.store.UserByUsername(r.Context(), in.Username)
	if err != nil || !security.VerifyPassword(user.PasswordHash, in.Password) {
		time.Sleep(150 * time.Millisecond)
		writeError(w, http.StatusUnauthorized, "invalid username or password")
		return
	}
	a.startSession(w, r, user)'''
          new_login = '''key := loginFailureKey(r, in.Username)
	count, err := a.store.LoginFailureCount(r.Context(), key, time.Now().Add(-15*time.Minute))
	if err != nil {
		a.internal(w, err)
		return
	}
	if count >= 8 {
		w.Header().Set("Retry-After", "900")
		writeError(w, http.StatusTooManyRequests, "too many login attempts")
		return
	}
	user, err := a.store.UserByUsername(r.Context(), in.Username)
	if err != nil || !security.VerifyPassword(user.PasswordHash, in.Password) {
		_ = a.store.RecordLoginFailure(r.Context(), key, time.Now())
		time.Sleep(150 * time.Millisecond)
		writeError(w, http.StatusUnauthorized, "invalid username or password")
		return
	}
	_ = a.store.ClearLoginFailures(r.Context(), key)
	a.startSession(w, r, user)'''
          a = a.replace(old_login, new_login)
          insert_before = 'func (a *App) startSession(w http.ResponseWriter, r *http.Request, user store.User) {'
          helper = r'''func loginFailureKey(r *http.Request, username string) string {
	host := r.RemoteAddr
	if h, _, err := net.SplitHostPort(r.RemoteAddr); err == nil {
		host = h
	}
	return security.TokenHash(strings.ToLower(strings.TrimSpace(username)) + "|" + host)
}

'''
          if 'func loginFailureKey' not in a:
              a = a.replace(insert_before, helper + insert_before)
              a = a.replace('"mime"\n\t"net/http"', '"mime"\n\t"net"\n\t"net/http"')

          # replace import endpoint with transactional replace semantics for RDP Web backups; legacy import remains additive
          old = 'writeJSON(w, 200, map[string]any{"groupsImported": groupsImported, "devicesImported": devicesImported, "passwordsImported": 0})'
          # leave legacy additive path intact; add dedicated restore endpoint separately
          a = a.replace('case r.Method == http.MethodPost && r.URL.Path == "/api/import":\n\t\ta.importData(w, r)', 'case r.Method == http.MethodPost && r.URL.Path == "/api/import":\n\t\ta.importData(w, r)\n\tcase r.Method == http.MethodPost && r.URL.Path == "/api/restore":\n\t\ta.restoreData(w, r)')
          restore_fn = r'''
func (a *App) restoreData(w http.ResponseWriter, r *http.Request) {
	s := mustSession(r)
	var raw backup
	if err := decodeJSONCompat(r, &raw, 2<<20); err != nil {
		writeError(w, 400, err.Error())
		return
	}
	if raw.Schema != 1 || raw.App != "RDP Web" {
		writeError(w, 400, "restore requires an RDP Web schema-1 backup")
		return
	}
	if len(raw.Devices) > 5000 || len(raw.Groups) > 500 {
		writeError(w, 400, "restore is too large")
		return
	}
	if err := a.store.RestoreReplace(r.Context(), s.UserID, store.RestorePayload{Groups: raw.Groups, Devices: raw.Devices}); err != nil {
		writeError(w, 400, err.Error())
		return
	}
	writeJSON(w, 200, map[string]any{"groupsRestored": len(raw.Groups), "devicesRestored": len(raw.Devices)})
}

'''
          if 'func (a *App) restoreData' not in a:
              a = a.replace('func (a *App) validOrigin', restore_fn + 'func (a *App) validOrigin')
          app.write_text(a)

          test = Path('internal/app/app_integration_test.go')
          test.write_text(r'''package app

import (
	"bytes"
	"encoding/json"
	"io"
	"log/slog"
	"net/http"
	"net/http/httptest"
	"path/filepath"
	"strings"
	"sync"
	"testing"
	"time"

	"github.com/Shermanxwz/RDP-web/internal/store"
)

type client struct {
	base string
	csrf string
	cookie *http.Cookie
}

func newTestApp(t *testing.T, dbPath string) (*httptest.Server, *store.Store) {
	t.Helper()
	db, err := store.Open(dbPath)
	if err != nil { t.Fatal(err) }
	h, err := New(Config{Store: db, Logger: slog.New(slog.NewTextHandler(io.Discard, nil)), SessionTTL: time.Hour})
	if err != nil { t.Fatal(err) }
	ts := httptest.NewServer(h)
	return ts, db
}

func (c *client) do(t *testing.T, method, path, body string) (*http.Response, []byte) {
	t.Helper()
	req, err := http.NewRequest(method, c.base+path, strings.NewReader(body))
	if err != nil { t.Fatal(err) }
	if body != "" { req.Header.Set("Content-Type", "application/json") }
	if c.cookie != nil { req.AddCookie(c.cookie) }
	if c.csrf != "" && method != http.MethodGet { req.Header.Set("X-RDPWeb-CSRF", c.csrf) }
	resp, err := http.DefaultClient.Do(req)
	if err != nil { t.Fatal(err) }
	b, _ := io.ReadAll(resp.Body); resp.Body.Close()
	for _, ck := range resp.Cookies() { if ck.Name == cookieName { c.cookie = ck } }
	var out map[string]any
	if json.Unmarshal(b, &out) == nil { if v, ok := out["csrfToken"].(string); ok { c.csrf = v } }
	return resp, b
}

func TestFullHTTPPersistenceAndRestore(t *testing.T) {
	dir := t.TempDir(); dbPath := filepath.Join(dir, "rdpweb.db")
	ts, db := newTestApp(t, dbPath); c := &client{base: ts.URL}
	if r,_ := c.do(t,"GET","/healthz",""); r.StatusCode != 200 { t.Fatalf("health %d", r.StatusCode) }
	if r,_ := c.do(t,"POST","/api/setup",`{"username":"owner","password":"correct horse battery staple"}`); r.StatusCode != 200 { t.Fatalf("setup %d", r.StatusCode) }
	if r,_ := c.do(t,"POST","/api/groups",`{"id":"g1","name":"Prod","sortOrder":0}`); r.StatusCode != 201 { t.Fatalf("group %d", r.StatusCode) }
	dev := `{"id":"d1","groupId":"g1","name":"Server","host":"example.com","port":3389,"username":"admin","domain":"","gateway":"","favorite":true,"notes":"n","useMultimon":false,"redirectClipboard":true,"audioMode":0}`
	if r,_ := c.do(t,"POST","/api/devices",dev); r.StatusCode != 201 { t.Fatalf("device %d", r.StatusCode) }
	r, backup := c.do(t,"GET","/api/export",""); if r.StatusCode != 200 || !bytes.Contains(backup, []byte(`"d1"`)) { t.Fatalf("export %d %s", r.StatusCode, backup) }
	if r,_ := c.do(t,"GET","/api/devices/d1/uri",""); r.StatusCode != 200 { t.Fatalf("uri %d", r.StatusCode) }
	if r,b := c.do(t,"GET","/api/devices/d1/rdp",""); r.StatusCode != 200 || len(b) < 4 || b[0] != 0xff || b[1] != 0xfe { t.Fatalf("rdp %d", r.StatusCode) }
	ts.Close(); db.Close()

	ts2, db2 := newTestApp(t, dbPath); defer ts2.Close(); defer db2.Close(); c2 := &client{base: ts2.URL}
	if r,_ := c2.do(t,"POST","/api/login",`{"username":"owner","password":"correct horse battery staple"}`); r.StatusCode != 200 { t.Fatalf("relogin %d", r.StatusCode) }
	if r,b := c2.do(t,"GET","/api/devices",""); r.StatusCode != 200 || !bytes.Contains(b, []byte(`"d1"`)) { t.Fatalf("persist %d %s", r.StatusCode,b) }
	if r,_ := c2.do(t,"DELETE","/api/devices/d1",""); r.StatusCode != 204 { t.Fatalf("delete %d", r.StatusCode) }
	if r,b := c2.do(t,"POST","/api/restore",string(backup)); r.StatusCode != 200 { t.Fatalf("restore %d %s", r.StatusCode,b) }
	if r,b := c2.do(t,"GET","/api/devices",""); r.StatusCode != 200 || !bytes.Contains(b, []byte(`"d1"`)) { t.Fatalf("restored %d %s", r.StatusCode,b) }
}

func TestSetupIsSingleOwnerUnderConcurrency(t *testing.T) {
	dbPath := filepath.Join(t.TempDir(), "db.sqlite")
	ts, db := newTestApp(t, dbPath); defer ts.Close(); defer db.Close()
	var wg sync.WaitGroup; statuses := make(chan int, 2)
	for _, u := range []string{"ownerone","ownertwo"} {
		wg.Add(1); go func(user string){ defer wg.Done(); c:=&client{base:ts.URL}; r,_:=c.do(t,"POST","/api/setup",`{"username":"`+user+`","password":"correct horse battery staple"}`); statuses<-r.StatusCode }(u)
	}
	wg.Wait(); close(statuses)
	ok := 0; conflict := 0
	for s := range statuses { if s==200 {ok++}; if s==409 {conflict++} }
	if ok != 1 || conflict != 1 { t.Fatalf("expected one success and one conflict, got ok=%d conflict=%d", ok, conflict) }
	count, err := db.UserCount(t.Context()); if err != nil || count != 1 { t.Fatalf("users=%d err=%v", count, err) }
}

func TestLoginRateLimit(t *testing.T) {
	ts, db := newTestApp(t, filepath.Join(t.TempDir(), "db.sqlite")); defer ts.Close(); defer db.Close(); c:=&client{base:ts.URL}
	if r,_:=c.do(t,"POST","/api/setup",`{"username":"owner","password":"correct horse battery staple"}`); r.StatusCode != 200 {t.Fatal(r.StatusCode)}
	c.cookie=nil; c.csrf=""
	for i:=0;i<8;i++ { r,_:=c.do(t,"POST","/api/login",`{"username":"owner","password":"wrong password value"}`); if r.StatusCode != 401 { t.Fatalf("attempt %d=%d",i,r.StatusCode) } }
	r,_:=c.do(t,"POST","/api/login",`{"username":"owner","password":"wrong password value"}`); if r.StatusCode != 429 { t.Fatalf("expected 429 got %d",r.StatusCode) }
}
''')

          # update CI to run container smoke + persistence
