name: Seal bootstrap

on:
  push:
    branches: [hardening/seal-v1]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hardening/seal-v1
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Refresh deterministic npm lock
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high
      - name: Commit lock refresh when needed
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m 'chore: refresh Playwright test lockfile'
          git push origin HEAD:hardening/seal-v1
